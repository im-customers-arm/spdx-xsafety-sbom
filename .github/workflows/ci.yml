name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run mypy
        run: uv run mypy src/

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest tests/ --cov=spdx_xsafety_sbom --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync

      - name: Test CLI help
        run: uv run spdx-xsafety-sbom --help

      - name: Test generate command help
        run: uv run spdx-xsafety-sbom generate --help

      - name: Test validate command help
        run: uv run spdx-xsafety-sbom validate --help

      - name: Test version command
        run: uv run spdx-xsafety-sbom version

      - name: Generate test SBOM
        run: |
          uv run spdx-xsafety-sbom generate \
            tests/fixtures/sdoc \
            -o test-output.json \
            --no-source-scan

      - name: Validate generated SBOM
        run: uv run spdx-xsafety-sbom validate test-output.json

      - name: Generate Sphinx-Needs test SBOM
        run: |
          uv run spdx-xsafety-sbom generate \
            tests/fixtures/sphinxneeds/needs.json \
            -o test-output-sphinxneeds.json \
            --no-source-scan \
            --input-format sphinx-needs

      - name: Validate generated Sphinx-Needs SBOM
        run: uv run spdx-xsafety-sbom validate test-output-sphinxneeds.json

      - name: Verify JSON-LD structure
        run: |
          uv run python -c "
          import json
          with open('test-output.json') as f:
              doc = json.load(f)
          assert '@context' in doc
          assert '@graph' in doc
          print('Generated SBOM with', len(doc['@graph']), 'elements')
          "

      - name: Verify Sphinx-Needs JSON-LD structure
        run: |
          uv run python -c "
          import json
          with open('test-output-sphinxneeds.json') as f:
              doc = json.load(f)
          assert '@context' in doc
          assert '@graph' in doc
          print('Generated Sphinx-Needs SBOM with', len(doc['@graph']), 'elements')
          "
