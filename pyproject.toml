[project]
name = "spdx-xsafety-sbom"
version = "0.1.0"
description = "Generate SPDX 3.0.1 Design SBOMs with xSafety extension from StrictDoc artifacts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ARM", email = "team@arm.com" }]
keywords = ["spdx", "sbom", "safety", "iso-26262", "strictdoc", "functional-safety", "xsafety", "design-sbom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = ["setuptools>=70.0.0,<75.0.0", "click>=8.1.0", "rich>=13.0.0", "pydantic>=2.0.0", "strictdoc>=0.0.59,<0.1.0"]

[project.optional-dependencies]
validation = ["pyshacl>=0.25.0", "rdflib>=7.0.0", "pyld>=2.0.0", "jsonschema>=4.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "mypy>=1.10.0", "pyinstaller>=6.0.0"]
all = ["spdx-xsafety-sbom[validation,dev]"]

[project.scripts]
spdx-xsafety-sbom = "spdx_xsafety_sbom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spdx_xsafety_sbom"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning:textx\\.registration",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]
